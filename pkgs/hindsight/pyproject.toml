[project]
name = "hindsight-api-environment"
version = "0.10.2"
requires-python = ">=3.12,<3.13"
dependencies = ["hindsight-api==0.10.2"]

[tool.uv]
package = false
# Resolve against distributions available when the 0.10.2 bundle was published.
exclude-newer = "2026-09-29T09:42:18Z"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
